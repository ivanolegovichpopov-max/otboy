.nickrow{font-size:18px;color:#d9ccb0}#nick{width:150px;font-family:Neucha,system-ui;font-size:19px;text-align:center;padding:5px;border-radius:10px;border:1px dashed rgba(233,220,192,.5);background:#1a140f;color:#f4ead2}

<body>
<canvas id="c"></canvas>
<button id="throw">🏐</button>
<button id="burstb">💨</button>
<button id="flashb">🔦</button>

<div id="menu" class="screen">
 <button class="back hidden" id="back" aria-label="Назад">‹</button>
 <div class="pg" id="pgMain">
  <h1>ОТБОЙ</h1>
  <div class="sub">заброшенный пионерлагерь · четверо против охотника</div>
  <button class="mecard" id="meCard"><img id="meImg" alt=""><span id="meName"></span><small>✎ изменить</small></button>
  <button class="big" id="goPlay">Играть</button>
  <div class="row2"><button class="vibb" id="goHow">Как играть</button><button class="vibb gear" id="goSet" aria-label="Настройки">⚙</button></div>
 </div>
 <div class="pg hidden" id="pgMode">
  <h2>Как играем?</h2>
  <div class="tiles">
   <button class="tile" id="play"><span class="ti">🌙</span><b>Одному</b><small>с ботами</small></button>
   <button class="tile" id="goFr"><span class="ti">🤝</span><b>С друзьями</b><small>до 4 человек</small></button>
  </div>
 </div>
 <div class="pg hidden" id="pgFr">
  <h2 id="frTitle">С друзьями</h2>
  <div class="mp">
   <div id="mpPre"><button class="big" id="mpHost">Создать комнату</button>
    <div class="or">или войди по коду друга</div>
    <div class="joinrow"><input id="mpCode" inputmode="numeric" maxlength="4" placeholder="код"><button class="vibb" id="mpJoin">Войти</button></div></div>
   <div id="lobby" class="hidden">
    <div class="lbTitle">Код <b id="lbCode"></b> <button class="vibb" id="lbInv">Позвать</button></div>
    <div id="lbList"></div>
    <button class="big" id="lbStart">Начать матч</button>
   </div>
   <div id="mpMsg"></div></div>
 </div>
 <div class="pg hidden" id="pgLook">
  <h2>Мой персонаж</h2>
  <div class="nickrow"><input id="nick" maxlength="12" placeholder="твоё имя" autocomplete="off"></div>
  <div id="lookBox"><img id="lookImg" alt=""><div id="lookRows"></div></div>
  <button class="big" id="lookOk">Готово</button>
 </div>
 <div class="pg hidden" id="pgHow">
  <h2>Как играть</h2>
  <div id="howCards"></div>
  <button class="big" id="howOk">Понятно</button>
 </div>
 <div class="pg hidden" id="pgSet">
  <h2>Настройки</h2>
  <div class="sets"><button class="sw" id="sndSw"></button><button class="sw" id="vibb"></button></div>
  <button class="big" id="setOk">Готово</button>
 </div>
</div>

<div id="end" class="screen hidden">
  <h2 id="endTitle"></h2>
  <div class="stats" id="endStats"></div>
  <button class="big" id="again">Ещё раз</button>
  <div><button class="vibb" id="toLobby">В меню</button></div>
</div>

<script>
'use strict';
const SRV=typeof __SRV!=='undefined',VER='s16',SRV_URL='wss://otboy-server.onrender.com';
const $=id=>document.getElementById(id);
const cv=$('c'),ctx=cv.getContext('2d');
const dark=document.createElement('canvas'),dctx=dark.getContext('2d');
let DPR=1,VW=0,VH=0,SC=1,BSC=1,zoom=1;
let QL=2;
function resize(){DPR=Math.min(2,window.devicePixelRatio||1)*(QL===2?1:QL===1?0.75:0.5);VW=innerWidth;VH=innerHeight;if(VW*VH*DPR*DPR>2.2e6)DPR=Math.sqrt(2.2e6/(VW*VH));cv.width=Math.round(VW*DPR);cv.height=Math.round(VH*DPR);dark.width=Math.ceil(cv.width/2);dark.height=Math.ceil(cv.height/2);BSC=Math.min(VW,VH)/460;SC=BSC*(typeof zoom!=='undefined'?zoom:1);}
addEventListener('resize',resize);resize();

const clamp=(v,a,b)=>v<a?a:v>b?b:v;
const dist=(a,b)=>Math.hypot(a.x-b.x,a.y-b.y);
function rng(seed){return function(){seed|=0;seed=seed+0x6D2B79F5|0;let t=Math.imul(seed^seed>>>15,1|seed);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
function lerpAng(a,b,t){let d=((b-a+Math.PI*3)%(Math.PI*2))-Math.PI;return a+d*t;}

const WW=2400,WH=1800,WALK=110,RUN=200,BOOST=265,BURST=290;
let rects,walls,circles,buildings,trees,lakeC,specks,lamps,gateN,gateS;
const PATHS=[
 [[1200,0],[1200,560],[1080,600],[1080,1180],[1200,1220],[1200,1800]],
 [[350,400],[350,600],[700,620],[1460,620],[1800,620],[1800,440]],
 [[350,960],[350,1100],[700,1100],[1460,1100],[1700,1200],[1840,1350]],
 [[540,840],[700,840]],[[350,1100],[350,1300]]
];

function addR(x,y,w,h,kind){const r={x,y,w,h,kind};rects.push(r);if(kind==='wall')walls.push(r);return r;}
function cut(segs,a,b){const out=[];for(const [s,e] of segs){if(b<=s||a>=e){out.push([s,e]);continue;}if(a>s)out.push([s,a]);if(b<e)out.push([b,e]);}return out;}
function building(name,x,y,w,h,doors,part,roof,sign,chim){
 const T=16,D=84,n0=rects.length;
 const sides={top:[x,y,w,T,'h'],bottom:[x,y+h-T,w,T,'h'],left:[x,y,T,h,'v'],right:[x+w-T,y,T,h,'v']};
 for(const s in sides){const [sx,sy,sw,sh,o]=sides[s];const ds=doors.filter(d=>d[0]===s).map(d=>d[1]);
  if(o==='h'){let segs=[[sx,sx+sw]];ds.forEach(f=>{const c=sx+sw*f;segs=cut(segs,c-D/2,c+D/2);});segs.forEach(([a,b])=>addR(a,sy,b-a,sh,'wall'));}
  else{let segs=[[sy,sy+sh]];ds.forEach(f=>{const c=sy+sh*f;segs=cut(segs,c-D/2,c+D/2);});segs.forEach(([a,b])=>addR(sx,a,sw,b-a,'wall'));}
 }
 if(part==='top')addR(x+w/2-8,y,16,h*0.45,'wall');
 if(part==='bottom')addR(x+w/2-8,y+h-h*0.45,16,h*0.45,'wall');
 const B={name,x,y,w,h,roof,sign,chim:!!chim,alpha:1,wallA:1,doors:doors.map(([s,f])=>({side:s,x:s==='left'?x:s==='right'?x+w:x+w*f,y:s==='top'?y:s==='bottom'?y+h:y+h*f}))};buildings.push(B);for(let i=n0;i<rects.length;i++)rects[i].b=B;
}
function segDist(px,py,ax,ay,bx,by){const dx=bx-ax,dy=by-ay,l=dx*dx+dy*dy;let t=l?((px-ax)*dx+(py-ay)*dy)/l:0;t=clamp(t,0,1);return Math.hypot(px-ax-t*dx,py-ay-t*dy);}
function nearPath(x,y){let m=1e9;for(const p of PATHS)for(let i=1;i<p.length;i++)m=Math.min(m,segDist(x,y,p[i-1][0],p[i-1][1],p[i][0],p[i][1]));return m;}

function hits(x,y,r){
 for(const o of rects){if(o.open)continue;const cx=clamp(x,o.x,o.x+o.w),cy=clamp(y,o.y,o.y+o.h);if((x-cx)*(x-cx)+(y-cy)*(y-cy)<r*r)return true;}
 for(const c of circles){const R=r+c.r;if((x-c.x)*(x-c.x)+(y-c.y)*(y-c.y)<R*R)return true;}
 return false;
}

// ---------- навигация ----------
const CS=24,GW=WW/CS,GH=WH/CS;let grid=new Uint8Array(GW*GH);
let gridS=new Uint8Array(GW*GH),NG=grid,inB=new Uint8Array(GW*GH),DISC=false;
function hitsNoLow(x,y,r){for(const o of rects){if(o.open||o.kind==='low')continue;const cx=clamp(x,o.x,o.x+o.w),cy=clamp(y,o.y,o.y+o.h);if((x-cx)*(x-cx)+(y-cy)*(y-cy)<r*r)return true;}for(const c of circles){const R=r+c.r;if((x-c.x)*(x-c.x)+(y-c.y)*(y-c.y)<R*R)return true;}return false;}
function buildGrid(){reachC=null;for(let j=0;j<GH;j++)for(let i=0;i<GW;i++){const x=i*CS+CS/2,y=j*CS+CS/2;grid[j*GW+i]=hits(x,y,17)?1:0;gridS[j*GW+i]=hitsNoLow(x,y,15)?1:0;inB[j*GW+i]=buildings.some(b=>x>b.x&&x<b.x+b.w&&y>b.y&&y<b.y+b.h)?1:0;}}
function freeCell(x,y){const i=clamp(Math.floor(x/CS),0,GW-1),j=clamp(Math.floor(y/CS),0,GH-1);if(!NG[j*GW+i])return j*GW+i;
 for(let r=1;r<9;r++)for(let dj=-r;dj<=r;dj++)for(let di=-r;di<=r;di++){if(Math.abs(di)!==r&&Math.abs(dj)!==r)continue;const a=i+di,b=j+dj;if(a<0||b<0||a>=GW||b>=GH)continue;if(!NG[b*GW+a])return b*GW+a;}return -1;}
const gS=new Float32Array(GW*GH),came=new Int32Array(GW*GH),stamp=new Uint32Array(GW*GH),closedA=new Uint32Array(GW*GH);let cur=0;
const DX=[1,-1,0,0,1,1,-1,-1],DY=[0,0,1,-1,1,-1,1,-1];
function hpush(h,v){h.push(v);let i=h.length-1;while(i>0){const p=(i-1)>>1;if(h[p][0]<=h[i][0])break;const t=h[p];h[p]=h[i];h[i]=t;i=p;}}
function hpop(h){const top=h[0],last=h.pop();if(h.length){h[0]=last;let i=0;for(;;){const l=2*i+1,r=l+1;let m=i;if(l<h.length&&h[l][0]<h[m][0])m=l;if(r<h.length&&h[r][0]<h[m][0])m=r;if(m===i)break;const t=h[m];h[m]=h[i];h[i]=t;i=m;}}return top;}
function findPath(x0,y0,x1,y1){
 const s=freeCell(x0,y0),g=freeCell(x1,y1);if(s<0||g<0)return null;cur++;
 const gx=g%GW,gy=(g/GW)|0;const H=n=>{const dx=Math.abs(n%GW-gx),dy=Math.abs(((n/GW)|0)-gy);return dx+dy-0.586*Math.min(dx,dy);};

  [im(KILLER_SVG),'Охотник','Первый удар ранит, второй — уносит в кладовку. Постой у кладовки, чтобы выпустить друга. Третья кладовка — выбыл.'],
  [ic(FL),'Защита и управление',(isTouch?'Веди пальцем: чуть — идёшь, дальше — бежишь, за кругом — рывок. Тап вторым пальцем или короткий тап на месте — фонарик. ':'WASD — бег, Ctrl — тихо, мышь — свет, Shift — рывок, F — фонарик, Пробел — действие. ')+'Фонарь в лицо ослепит охотника, но заряда — на минуту.']];
 const box=$('howCards');C.forEach(([i,t,x])=>{const d=document.createElement('div');d.className='card';d.innerHTML='<div class="ci">'+i+'</div><div><b>'+t+'</b>'+x+'</div>';box.appendChild(d);});}
go('pgMain');}

function vibLabel(){$('vibb').innerHTML='Вибрация <i>'+(vibOn?'вкл':'выкл')+'</i>';$('vibb').classList.toggle('off',!vibOn);$('vibb').style.display=isTouch?'':'none';}vibLabel();
$('vibb').onclick=()=>{vibOn=!vibOn;try{localStorage.setItem('otboy_vib',vibOn?'1':'0');}catch(e){}vibLabel();vib(30);};$('again').onclick=()=>{if(NET.srv){netSend({t:'start'});return;}if(NET.role==='guest'){$('endTitle').textContent='Ждём, пока друг начнёт заново…';return;}start();};
document.addEventListener('visibilitychange',()=>{paused=document.hidden;resetInput();try{if(AC)paused?AC.suspend():AC.resume();}catch(e){}});
